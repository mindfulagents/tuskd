[workspace]
resolver = "2"
members = [
    "crates/tusk-core",
    "crates/tusk-mcp",
    "crates/tusk-sync",
    "crates/tuskd",
]

[workspace.package]
version = "0.7.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mindfulagents/tuskd"

[workspace.dependencies]
tusk-core = { path = "crates/tusk-core" }
tusk-mcp = { path = "crates/tusk-mcp" }
tusk-sync = { path = "crates/tusk-sync" }
tuskd = { path = "crates/tuskd" }

thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
ulid = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time", "process"] }
axum = "0.8"
hyper = "1"
clap = { version = "4", features = ["derive"] }
notify = "7"
fs2 = "0.4"
tar = "0.4"
flate2 = "1"
tempfile = "3"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
bip39 = "2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
