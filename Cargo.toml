[workspace]
resolver = "2"
members = [
    "crates/tusk-core",
    "crates/tusk-mcp",
    "crates/tuskd",
    "tests/acceptance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tusk-core = { path = "crates/tusk-core" }
tusk-mcp = { path = "crates/tusk-mcp" }
tuskd = { path = "crates/tuskd" }

thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ulid = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time", "process"] }
axum = "0.8"
hyper = "1"
clap = { version = "4", features = ["derive"] }
notify = "7"
tar = "0.4"
flate2 = "1"
tempfile = "3"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
