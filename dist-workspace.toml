[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app — none: get.opentusk.ai/install.sh
# is our installer and fetches the tarballs below (DECISIONS D19)
installers = []
# Target platforms to build apps for (Rust target-triple syntax).
# Linux is musl (static, no glibc dependency) per the platform ground rules.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Where to host releases
hosting = "github"
# Emit a .sha256 next to each artifact (install.sh verifies before installing)
checksum = "sha256"
# Build all release artifacts on PRs that touch them, so target breakage
# surfaces before a tag is pushed
pr-run-mode = "upload"
# Use gzip tarballs (install.sh expects .tar.gz and pipes through tar -xz)
unix-archive = ".tar.gz"
